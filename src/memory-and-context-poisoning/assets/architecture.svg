<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">PatchPilot release memory architecture</title>
  <desc id="desc">A Streamlit UI calls a FastAPI service. Evidence enters ADLS Gen2, passes permission trimming, then passes trust admission before approved memory is indexed and retrieved. Quarantined claims go to audit and rollback.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #172554; }
    .box { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 12; }
    .gate { fill: #ecfdf5; stroke: #059669; stroke-width: 3; rx: 12; }
    .danger { fill: #fff1f2; stroke: #e11d48; stroke-width: 2; rx: 12; }
    .arrow { stroke: #475569; stroke-width: 3; marker-end: url(#arrow); }
    .label { font-size: 20px; font-weight: bold; }
    .small { font-size: 15px; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
  <rect class="box" x="30" y="250" width="180" height="100"/>
  <text class="label" x="65" y="290">Streamlit UI</text>
  <text class="small" x="55" y="320">Synthetic personas</text>
  <rect class="box" x="270" y="250" width="190" height="100"/>
  <text class="label" x="315" y="290">FastAPI</text>
  <text class="small" x="292" y="320">Managed identity</text>
  <rect class="box" x="270" y="60" width="190" height="100"/>
  <text class="label" x="310" y="100">ADLS Gen2</text>
  <text class="small" x="290" y="130">Evidence and ACL data</text>
  <rect class="gate" x="520" y="160" width="210" height="110"/>
  <text class="label" x="548" y="202">Permission gate</text>
  <text class="small" x="548" y="232">Tenant and groups</text>
  <rect class="gate" x="790" y="160" width="210" height="110"/>
  <text class="label" x="835" y="202">Trust gate</text>
  <text class="small" x="810" y="232">Source, approval, status</text>
  <rect class="box" x="790" y="340" width="210" height="110"/>
  <text class="label" x="824" y="382">AI Search</text>
  <text class="small" x="810" y="412">Approved shared memory</text>
  <rect class="danger" x="1040" y="160" width="140" height="110"/>
  <text class="label" x="1051" y="202">Quarantine</text>
  <text class="small" x="1058" y="232">Audit and rollback</text>
  <line class="arrow" x1="210" y1="300" x2="270" y2="300"/>
  <line class="arrow" x1="365" y1="250" x2="365" y2="160"/>
  <line class="arrow" x1="460" y1="110" x2="565" y2="160"/>
  <line class="arrow" x1="460" y1="300" x2="520" y2="230"/>
  <line class="arrow" x1="730" y1="215" x2="790" y2="215"/>
  <line class="arrow" x1="895" y1="270" x2="895" y2="340"/>
  <line class="arrow" x1="1000" y1="215" x2="1040" y2="215"/>
  <line class="arrow" x1="790" y1="395" x2="460" y2="325"/>
  <text class="small" x="515" y="535">Authorization determines who may read a memory.</text>
  <text class="small" x="515" y="565">Trust admission determines whether that memory may guide an agent.</text>
</svg>
